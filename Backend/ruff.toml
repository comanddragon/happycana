# Exclude directories
exclude = [".venv", ".output", ".scripts", "staticfiles"]

# Target Python 3.13
target-version = "py313"

# Configure rule sets
[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "D",      # pydocstyle
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "N806",
    "RUF012",
    "S110",
    "BLE001",
    "TRY401",
    "TRY002",
]

[lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
"*/tests/*.py" = ["S101"]
"*/settings/*.py" = ["F405"]
"manage.py" = ["E402"]

[lint.pydocstyle]
convention = "google"