[tool.ruff]
exclude = [".venv", ".output", ".scripts", "staticfiles"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "RUF",
]

ignore = [
    "E501",
    "N806",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
"*/tests/*.py" = ["S101"]
"*/settings/*.py" = ["F405"]
"manage.py" = ["E402"]