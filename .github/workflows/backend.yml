name: Backend

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements/*.txt
      - run: pip install -r requirements/development.txt
      - run: ruff check . --exclude .venv,.output,.scripts,staticfiles
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q
      - run: python manage.py spectacular --file /tmp/openapi.yml
      - name: Validate production security settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-random-looking-and-over-fifty-characters-12345
          ALLOWED_HOSTS: api.example.test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          CORS_ALLOWED_ORIGINS: https://shop.example.test
          AWS_ACCESS_KEY_ID: ci-placeholder
          AWS_SECRET_ACCESS_KEY: ci-placeholder
          AWS_STORAGE_BUCKET_NAME: ci-placeholder
          SENTRY_DSN: ""
          SECURE_SSL_REDIRECT: "true"
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
        run: python manage.py check --deploy
